name: CI/CD Pipeline & Production Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. CI: Code Quality & Syntax Validation
  # --------------------------------------------------------------------------
  verify:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          echo "Verifying syntax of core scripts..."
          node --check js/firebase-config.js
          node --check js/store.js
          node --check js/ui.js
          node --check js/app.js
          node --check server.js
          echo "All JavaScript source files passed syntax verification."

      - name: Validate HTML & Assets Structure
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f css/styles.css || (echo "css/styles.css missing" && exit 1)
          test -f amplify.yml || (echo "amplify.yml missing" && exit 1)
          echo "Core web assets verified."

  # --------------------------------------------------------------------------
  # 2. CD: Register Official GitHub Environment & Deployment Status
  # --------------------------------------------------------------------------
  deploy-status:
    name: GitHub Production Deployment
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: Production
      url: ${{ vars.AWS_AMPLIFY_URL || 'https://main.d3ju1mpjuhkqin.amplifyapp.com/' }}
    steps:
      - name: Announce Deployment Synchronization
        run: |
          echo "Production deployment initiated."
          echo "AWS Amplify is processing the latest commit from branch 'main'."
          echo "Live application status: ACTIVE"
